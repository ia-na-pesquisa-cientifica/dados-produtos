<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        table {
            border-collapse: collapse;
            width: 60%;
            margin: 20px auto;
            background-color: #fff;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <h1>Lista de Produtos</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Produto</th>
                <th>Preço (R$)</th>
                <th>Estoque</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>001</td>
                <td>Notebook</td>
                <td>3500.00</td>
                <td>15</td>
            </tr>
            <tr>
                <td>002</td>
                <td>Mouse</td>
                <td>80.00</td>
                <td>120</td>
            </tr>
            <tr>
                <td>003</td>
                <td>Teclado Mecânico</td>
                <td>250.00</td>
                <td>45</td>
            </tr>
            <tr>
                <td>004</td>
                <td>Monitor 24"</td>
                <td>900.00</td>
                <td>30</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
